{{- if .Values.ghcrSecret.encryptedDockerConfigJson }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-secret
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    .dockerconfigjson: {{ .Values.ghcrSecret.encryptedDockerConfigJson }}
  template:
    metadata:
      name: ghcr-secret
      namespace: {{ .Release.Namespace }}
    type: kubernetes.io/dockerconfigjson
{{- end }}
