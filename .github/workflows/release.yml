# Manual release: tag, build and push the image to GHCR, bump the Helm image tag
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Tag, Build, Push, Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Version '$VERSION' does not match semver format (e.g., v0.2.0)" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 1. Tag ────────────────────────────────────────────────────────────

      - name: Create and push release tag
        run: |
          TAG="${{ steps.validate.outputs.version }}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      # ── 2. Build and push Docker image ────────────────────────────────────

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/silvatyrant/hxlink:${{ steps.validate.outputs.version }}
            ghcr.io/silvatyrant/hxlink:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 3. Update Helm values → triggers ArgoCD sync ─────────────────────

      - name: Update Helm image tag
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ steps.validate.outputs.version }}\"/" .helm/values.yaml
          git add .helm/values.yaml
          if git diff --cached --quiet; then
            echo "Helm tag already up to date — no commit needed"
          else
            git commit -m "chore: update Helm image tag to ${{ steps.validate.outputs.version }}"
            git push origin main
          fi

      # ── 4. Create GitHub Release ──────────────────────────────────────────

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.validate.outputs.version }}" \
            --title "${{ steps.validate.outputs.version }}" \
            --generate-notes \
            --target main
